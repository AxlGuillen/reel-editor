<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReelForge</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">⚡ ReelForge</div>
      <nav class="nav">
        <button class="nav-item active" data-target="view-vertical">
          <span class="nav-icon">📐</span> Vertical
        </button>
        <button class="nav-item" data-target="view-sound">
          <span class="nav-icon">🔊</span> SoundDrop
        </button>
        <button class="nav-item" data-target="view-insert">
          <span class="nav-icon">✂️</span> Insert
        </button>
        <button class="nav-item" data-target="view-downloader">
          <span class="nav-icon">⬇️</span> Downloader
        </button>
      </nav>
    </aside>

    <main class="content">
      <section id="view-vertical" class="module-view">
        {% include "modules/vertical_convert.html" %}
      </section>
      <section id="view-sound" class="module-view hidden">
        {% include "modules/sound_drop.html" %}
      </section>
      <section id="view-insert" class="module-view hidden">
        {% include "modules/insert.html" %}
      </section>
      <section id="view-downloader" class="module-view hidden">
        {% include "modules/downloader.html" %}
      </section>
    </main>
  </div>

  <script src="{{ url_for('static', filename='js/shared.js') }}"></script>
  <script src="{{ url_for('static', filename='js/vertical_convert.js') }}"></script>
  <script src="{{ url_for('static', filename='js/sound_drop.js') }}"></script>
  <script src="{{ url_for('static', filename='js/insert.js') }}"></script>
  <script src="{{ url_for('static', filename='js/downloader.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
