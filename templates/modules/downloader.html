<div class="module-header">
  <h1><svg class="icon h-icon"><use href="#i-download"/></svg> Downloader</h1>
  <p class="subtitle">Pega un link y descarga el video o su audio</p>
</div>

<section class="card">
  <label class="control">
    <span>Link del video</span>
    <input type="url" id="dl-url" class="dl-url"
           placeholder="https://…  (YouTube, TikTok, Instagram)">
  </label>

  <div class="dl-row">
    <div class="dl-field">
      <span class="dl-label">Formato</span>
      <div class="dl-toggle">
        <button type="button" class="dl-fmt active" data-fmt="audio"><svg class="icon"><use href="#i-music"/></svg> Audio (mp3)</button>
        <button type="button" class="dl-fmt" data-fmt="video"><svg class="icon"><use href="#i-film"/></svg> Video (mp4)</button>
      </div>
    </div>
    <label class="dl-field dl-quality-field">
      <span class="dl-label">Calidad</span>
      <select id="dl-quality"></select>
    </label>
  </div>

  <button id="dl-process-btn" class="btn-primary">Descargar</button>
  <p class="dl-note">
    Funciona mejor con contenido público. Instagram a veces falla o pide login.
  </p>
</section>

<!-- Progress + result -->
<div id="dl-progress-wrap" class="card hidden">
  <div class="progress-bar"><div id="dl-progress-fill"></div></div>
  <p id="dl-progress-label">Descargando… 0%</p>
</div>

<div id="dl-result-wrap" class="card card-accent hidden">
  <p class="success">✓ Listo</p>
  <p id="dl-result-title" class="file-name"></p>
  <a id="dl-download-btn" class="btn-primary" download>Guardar archivo</a>
  <button id="dl-reset-btn" class="btn-secondary">Descargar otro</button>
</div>

<div id="dl-error-wrap" class="card error hidden">
  <p id="dl-error-msg"></p>
  <button id="dl-error-reset-btn" class="btn-secondary">Reintentar</button>
</div>
